# pnpm settings for this repository (pnpm 11 reads settings from this file).
allowBuilds:
  esbuild: true

# pnpm's default layout uses junctions/symlinks. Inside this workspace the sandbox creates junctions
# with a `Global\`-prefixed target that Windows can read but Node's ESM resolver cannot follow, which
# breaks every package that has its own dependencies (vitest first). A flat, real-directory layout
# avoids symlinks entirely and behaves like npm.
nodeLinker: hoisted

# Do not re-run a dependency check before every `pnpm <script>`; CI verifies explicitly.
verifyDepsBeforeRun: false
